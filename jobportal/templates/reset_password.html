{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password — Malabon Ahon</title>

    <link
        rel="stylesheet"
        href="{% static 'css/reset_password.css' %}"
    >

</head>


<body>

    <main class="reset-page">

        <section
            class="reset-card"
            aria-label="Reset password"
        >


            <!-- =============================================
                 LEFT BRAND PANEL
            ============================================== -->

            <div class="reset-brand-panel">

                <img
                    class="reset-brand-logo"
                    src="{% static 'images/malabon_ahon_white.png' %}"
                    alt="Malabon Ahon"
                >

            </div>


            <!-- =============================================
                 RIGHT RESET PASSWORD PANEL
            ============================================== -->

            <div class="reset-form-panel">

                <div class="reset-content">


                    <!-- =====================================
                         LOCK ICON
                    ====================================== -->

                    <div
                        class="lock-circle"
                        aria-hidden="true"
                    >

                        <div class="lock-icon">

                            <div class="lock-shackle"></div>

                            <div class="lock-body">

                                <span class="lock-keyhole"></span>

                            </div>

                        </div>

                    </div>


                    <!-- =====================================
                         MESSAGE
                    ====================================== -->

                    <p class="reset-message">
                        Enter your new password.
                    </p>


                    <!-- =====================================
                         BACKEND ERROR
                    ====================================== -->

                    {% if error %}

                        <p class="backend-message">
                            {{ error }}
                        </p>

                    {% endif %}


                    <!-- =====================================
                         RESET PASSWORD FORM
                    ====================================== -->

                    <form
                        class="reset-form"
                        action="{% url 'accounts:reset_password' %}"
                        method="post"
                    >

                        {% csrf_token %}


                        <!-- NEW PASSWORD -->

                        <input
                            class="password-input"
                            type="password"
                            name="new_password"
                            placeholder="New Password"
                            autocomplete="new-password"
                            aria-label="New Password"
                            required
                        >


                        <!-- CONFIRM NEW PASSWORD -->

                        <input
                            class="password-input"
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm New Password"
                            autocomplete="new-password"
                            aria-label="Confirm New Password"
                            required
                        >


                        <!-- SAVE -->

                        <button
                            class="save-button"
                            type="submit"
                        >
                            Save
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
