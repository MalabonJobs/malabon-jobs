{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Malabon Ahon</title>
    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
</head>
<body>
<main class="forgot-page">
    <section class="forgot-card" aria-label="Forgot password">
        <div class="forgot-brand-panel">
            <img
                class="forgot-brand-logo"
                src="{% static 'images/malabon_ahon_white.png' %}"
                alt="Malabon Ahon"
            >
        </div>

        <div class="forgot-form-panel">
            <div class="forgot-content">
                <div class="lock-circle" aria-hidden="true">
                    <div class="lock-icon">
                        <div class="lock-shackle"></div>
                        <div class="lock-body">
                            <span class="lock-keyhole"></span>
                        </div>
                    </div>
                </div>

                <p class="forgot-message">
                    Please enter your email to<br>
                    receive a Verification card.
                </p>

                {% if error %}
                    <p class="backend-message">{{ error }}</p>
                {% endif %}

                <form class="forgot-form" method="post">
                    {% csrf_token %}

                    <input
                        class="email-input"
                        type="email"
                        name="email"
                        placeholder="Enter Email"
                        autocomplete="email"
                        aria-label="Enter Email"
                        required
                    >

                    <button class="send-button" type="submit">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>
